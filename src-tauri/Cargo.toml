[package]
name = "auton-grokbot"
version = "0.1.0"
description = "A local-first desktop AI workspace"
authors = ["Auton"]
edition = "2021"

[lib]
name = "auton_grokbot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
